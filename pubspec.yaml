name: logika_kids_app
description: "Aplikasi Notulen Terapi Harian Logika Kids (Flutter Mobile Android)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Lucide Icons (Matching Web Version Exactly)
  cupertino_icons: ^1.0.8
  lucide_icons: ^0.257.0
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.1

  # Cloud Database & Offline Storage
  supabase_flutter: ^2.8.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  connectivity_plus: ^6.0.3

  # PDF Generator, Printing & Share to WhatsApp
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^10.0.0
  url_launcher: ^6.3.0

  # Helper Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
